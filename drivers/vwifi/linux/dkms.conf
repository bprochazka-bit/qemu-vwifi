# DKMS packaging for the vwifi-virt Linux driver
#
# SPDX-License-Identifier: GPL-2.0-or-later
#
# Sourced as shell by dkms(8). PACKAGE_VERSION here is the single source
# of truth for the driver's version: dkms-install.sh reads it from this
# file, and checks it against VWIFI_DRV_VERSION in vwifi_drv.h so the
# module's modinfo cannot drift from the package it shipped in.

PACKAGE_NAME="vwifi"
PACKAGE_VERSION="1.0.1"

BUILT_MODULE_NAME[0]="vwifi"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Reuse the Makefile's own kbuild invocation rather than restating it.
# DKMS runs these from the staged build directory, and hands us the
# kernel tree for whichever kernel it is building against.
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"

# The point of DKMS here: a guest kernel gets upgraded and the module
# rebuilds itself instead of silently disappearing on the next boot.
AUTOINSTALL="yes"
